<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:40px 18px}.card{background:#0e1929;border:1px solid #233751;border-radius:22px;padding:25px;margin:15px 0}.eyebrow{color:#c8a66c;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}.score{font:700 64px Georgia,serif}.muted{color:#9eabbe}.q{padding:15px 0;border-top:1px solid #20334b}.correct{color:#78cf9a}.wrong{color:#e29a83}.pending{color:#e1b76b}.btn{background:#c8a66c;color:#111;border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}
</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">Submission received</div><h1 id="name">Result</h1><div class="score" id="score">—</div><p class="muted" id="note"></p></div><div class="card"><h2>MCQ Review</h2><div id="review"></div></div></main><script>
async function init(){const id=location.pathname.split('/').pop();const r=await fetch('/api/result/'+id);const j=await r.json();document.getElementById('name').textContent=j.submission.name;document.getElementById('score').textContent=`${j.submission.autoScore}/${j.submission.autoMax}`;document.getElementById('note').textContent='MCQ score is shown immediately. Subjective answers will be evaluated manually.';let h='';for(const q of j.test.questions){const a=j.submission.answers.find(x=>x.questionId===q.id);if(q.type==='mcq')h+=`<div class="q"><b>${q.question}</b><p class="${a?.correct?'correct':'wrong'}">${a?.correct?'Correct':'Incorrect / Unattempted'}</p><p class="muted">Correct answer: ${String.fromCharCode(65+Number(q.answer))}. ${q.options[q.answer]}</p><p class="muted">${q.explanation}</p></div>`;else h+=`<div class="q"><b>${q.question}</b><p class="pending">Subjective — awaiting manual evaluation</p></div>`}document.getElementById('review').innerHTML=h}init();
</script></body></html>
