<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--card:#0e1929;--line:#243954;--text:#f7f8fb;--muted:#9daabe;--gold:#c8a66c;--blue:#789cff;--easy:#75c99a;--mod:#e2b76d;--hard:#e28d76}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172943 0,#07101d 42%);color:var(--text);font-family:Inter,system-ui,sans-serif;user-select:none}.wrap{max-width:920px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.eyebrow{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.title{font:700 28px Georgia,serif}.timer{font-variant-numeric:tabular-nums;border:1px solid #334963;border-radius:999px;padding:10px 14px;background:#0d1929}.bar{height:5px;background:#142338;border-radius:99px;overflow:hidden;margin:15px 0 22px}.fill{height:100%;background:var(--gold);width:0}.card{background:linear-gradient(145deg,#101d2f,#0b1524);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 70px #0004}.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.badge{border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.Easy{background:#143324;color:var(--easy)}.Moderate{background:#382b16;color:var(--mod)}.Hard,.Very\ Hard{background:#3b211b;color:var(--hard)}.q{font:600 clamp(21px,3vw,29px)/1.4 Georgia,serif;margin:8px 0 22px}.option{display:block;padding:15px 16px;border:1px solid #263d58;border-radius:14px;margin:10px 0;background:#0b1726;cursor:pointer;transition:.18s}.option:hover{border-color:#55749b}.option.selected{border-color:var(--gold);background:#211d16}.option input{display:none}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#12100c}.secondary{background:#17263a;color:#eaf0f7;border:1px solid #304761}.upload{border:1px dashed #4a6380;border-radius:15px;padding:20px;text-align:center;background:#0a1523}.namebox{width:100%;padding:14px;background:#091321;color:white;border:1px solid #2b405b;border-radius:12px}.instructions{color:var(--muted);line-height:1.7}.intro{max-width:700px;margin:70px auto}.hidden{display:none!important}.danger{color:#e8a18f}.photo{max-width:100%;margin-top:12px;border-radius:12px}.review{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.dot{width:28px;height:28px;border-radius:50%;border:1px solid #334963;background:#0b1726;color:#c8d2df;font-size:11px}.dot.done{background:#223a35}.dot.current{border-color:var(--gold)}@media(max-width:650px){.wrap{padding-top:12px}.card{padding:18px}.top{align-items:flex-start}.title{font-size:23px}.timer{font-size:12px}}
</style></head>
<body><main class="wrap"><div id="intro" class="intro card"><div class="eyebrow">Private Examination Portal</div><h1 id="introTitle" class="title">Loading…</h1><p id="introSub" class="instructions"></p><ul id="inst" class="instructions"></ul><input id="name" class="namebox" placeholder="Enter your name"><br><br><button class="btn primary" onclick="start()">Start Test</button></div>
<div id="exam" class="hidden"><div class="top"><div><div class="eyebrow" id="subj"></div><div class="title" id="title"></div></div><div class="timer" id="timer">00:00</div></div><div class="bar"><div id="fill" class="fill"></div></div><div id="qcard" class="card"></div><div class="review" id="review"></div></div>
<script>
let test,idx=0,answers={},startedAt=null,remaining=0,interval=null;
const id='demo-writing-city-life';
const EMBEDDED_TEST={"id": "demo-writing-city-life", "title": "Writing and City Life — Advanced Test", "subtitle": "Class XI • History", "subject": "History", "chapter": "Theme 1: Writing and City Life", "durationMinutes": 50, "instructions": ["The paper contains a mixture of Easy, Moderate, Hard and Very Hard questions.", "MCQs are evaluated automatically after submission.", "For subjective questions, write your answer in your notebook and upload a clear photograph.", "Do not refresh the page during the test."], "questions": [{"id": "q1", "type": "mcq", "difficulty": "Easy", "marks": 1, "question": "Mesopotamia is the land between which two rivers?", "options": ["Nile and Tigris", "Euphrates and Tigris", "Euphrates and Nile", "Indus and Euphrates"], "answer": 1, "explanation": "Mesopotamia literally refers to the land between the Euphrates and Tigris rivers."}, {"id": "q2", "type": "mcq", "difficulty": "Easy", "marks": 1, "question": "Which of the following was the first known language of Mesopotamia?", "options": ["Akkadian", "Aramaic", "Sumerian", "Babylonian"], "answer": 2, "explanation": "Sumerian is described in the chapter as the earliest known language of the land."}, {"id": "q3", "type": "mcq", "difficulty": "Moderate", "marks": 1, "question": "Consider the following statements about southern Mesopotamia: (1) The region received insufficient rainfall for agriculture. (2) The Euphrates and Tigris deposited fertile silt. (3) Irrigation channels helped bring water to agricultural fields. (4) Urbanisation occurred simply because agriculture was highly productive. Which is correct?", "options": ["1, 2 and 3 only", "1 and 4 only", "2 and 3 only", "1, 2, 3 and 4"], "answer": 0, "explanation": "The chapter explains the importance of rivers, silt and irrigation, but cautions against explaining city growth merely through rural prosperity."}, {"id": "q4", "type": "mcq", "difficulty": "Moderate", "marks": 1, "question": "Which of the following best explains division of labour as a feature of urban life in Mesopotamia?", "options": ["Every city-dweller produced everything needed by his household.", "Different people specialised in different activities and depended upon one another.", "Only agricultural labour was divided among different groups.", "Labour was divided exclusively between kings and priests."], "answer": 1, "explanation": "Urban specialisation created interdependence among different producers and workers."}, {"id": "q5", "type": "mcq", "difficulty": "Moderate", "marks": 1, "question": "A stone-seal maker requires bronze tools and coloured stones, while the bronze-tool maker requires copper, tin and charcoal. This situation most directly demonstrates:", "options": ["the self-sufficiency of cities", "the interdependence created by urban specialisation", "the decline of craft production", "the absence of organised trade"], "answer": 1, "explanation": "Specialised urban production made producers dependent on one another and on long-distance exchange."}, {"id": "q6", "type": "mcq", "difficulty": "Moderate", "marks": 1, "question": "Which of the following was NOT a major reason for the movement of goods into Mesopotamian cities?", "options": ["Lack of metals in southern Mesopotamia", "Lack of suitable timber", "Lack of certain types of stone", "Complete absence of agricultural products"], "answer": 3, "explanation": "Mesopotamia had productive agriculture; it lacked several raw materials and exchanged its own produce for them."}, {"id": "q7", "type": "mcq", "difficulty": "Moderate", "marks": 1, "question": "Why was water transport particularly important for Mesopotamian cities?", "options": ["Boats required less food than animals used for transport.", "Water transport was useful only for military purposes.", "Rivers could not be used for transporting agricultural produce.", "Water transport eliminated the need for trade."], "answer": 0, "explanation": "Boats could transport bulky goods without the feeding requirements associated with animal transport."}, {"id": "q8", "type": "mcq", "difficulty": "Hard", "marks": 1, "question": "The earliest Mesopotamian tablets, dating to around 3200 BCE, mainly contained:", "options": ["Long historical narratives about kings", "Religious hymns and philosophical arguments", "Picture-like signs, numbers and lists of goods", "Detailed accounts of military campaigns"], "answer": 2, "explanation": "The earliest tablets were closely connected with recording goods, numbers and distributions."}, {"id": "q9", "type": "mcq", "difficulty": "Hard", "marks": 1, "question": "Which inference is most strongly supported by the early Mesopotamian tablets?", "options": ["Writing initially developed primarily for literary entertainment.", "Writing was closely connected with the need to maintain records in an increasingly complex urban society.", "Writing was restricted to recording religious myths.", "Writing developed only after kings had established large empires."], "answer": 1, "explanation": "The early use of writing for lists, numbers and distributions connects it closely with administration and urban complexity."}, {"id": "q10", "type": "mcq", "difficulty": "Hard", "marks": 1, "question": "In the story of Enmerkar and Aratta, why does the creation of a clay tablet become significant?", "options": ["It demonstrates the use of writing to preserve and communicate messages.", "It proves that clay tablets were originally used as currency.", "It shows that oral communication had completely disappeared.", "It proves that the story is a literal historical record."], "answer": 0, "explanation": "The story highlights the ability of writing to preserve a message that could otherwise be confused in oral transmission."}, {"id": "q11", "type": "mcq", "difficulty": "Hard", "marks": 1, "question": "Which of the following correctly describes the changing role of the temple in Mesopotamian urban life?", "options": ["It remained exclusively a place of worship.", "It became involved in production, employment, storage and keeping written records.", "It gradually lost all economic importance.", "It functioned only as the residence of kings."], "answer": 1, "explanation": "The temple became an important urban institution with economic and administrative functions in addition to worship."}, {"id": "q12", "type": "mcq", "difficulty": "Hard", "marks": 1, "question": "Assertion (A): Temples became important urban institutions in Mesopotamia. Reason (R): Temples were involved not only in worship but also in organising production, employing merchants and maintaining records.", "options": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true, but R is false.", "A is false, but R is true."], "answer": 0, "explanation": "The economic and administrative functions described in the Reason explain the wider importance of temples."}, {"id": "q13", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Arrange the following in the correct chronological order: (1) First writing in Mesopotamia (2) Earliest temples in southern Mesopotamia (3) Uruk develops into a huge city (4) Sumerian is gradually replaced by Akkadian (5) Sargon becomes king of Akkad.", "options": ["2 → 1 → 3 → 4 → 5", "1 → 2 → 3 → 5 → 4", "2 → 3 → 1 → 4 → 5", "2 → 1 → 4 → 3 → 5"], "answer": 0, "explanation": "The chapter timeline places earliest temples before writing, followed by the growth of Uruk and later the Akkadian period."}, {"id": "q14", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Which statement best explains why literacy remained limited in Mesopotamian society?", "options": ["Writing was considered unnecessary in cities.", "The writing system involved hundreds of signs, many of them complex.", "Clay tablets could not preserve information.", "Only foreigners were allowed to learn writing."], "answer": 1, "explanation": "The complexity and large number of cuneiform signs meant that literacy was limited to a relatively small group."}, {"id": "q15", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "A cylinder seal could be rolled over wet clay covering the knot of a package or the mouth of a pot. It could also be used on a clay tablet. Which conclusion follows most appropriately?", "options": ["Seals had only decorative value.", "Seals had practical as well as administrative and social significance.", "Seals were mainly weapons used by kings.", "Seals replaced writing completely."], "answer": 1, "explanation": "Cylinder seals helped secure objects and documents and could identify owners or officials."}, {"id": "q16", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Which combination correctly describes Mari? (1) It flourished as a royal capital after 2000 BCE. (2) It stood upstream on the Euphrates. (3) Its region combined agriculture and animal rearing. (4) Its population consisted exclusively of settled farmers. (5) Pastoralists and farmers could both cooperate and come into conflict.", "options": ["1, 2 and 3 only", "1, 2, 3 and 5 only", "2, 4 and 5 only", "1, 3, 4 and 5 only"], "answer": 1, "explanation": "Mari was an important riverine city in a pastoral zone; exchange and conflict between pastoralists and settled groups are both discussed."}, {"id": "q17", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Which statement best represents the chapter's treatment of pastoral communities in Mesopotamian history?", "options": ["Pastoralists were permanently excluded from urban civilisation.", "Pastoralists had no economic relationship with agricultural communities.", "Pastoral groups could trade with settled communities, enter the agricultural heartland and sometimes establish political rule.", "Pastoralists disappeared once cities emerged."], "answer": 2, "explanation": "The chapter shows that pastoralists interacted economically and politically with settled communities."}, {"id": "q18", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Consider this archaeological evidence: records of grain distribution, craft production, imported materials, written administrative documents and specialised workshops. Which interpretation is most consistent with the chapter?", "options": ["The settlement was economically isolated.", "The settlement displayed characteristics of an urban economy based on specialisation, exchange and organisation.", "The settlement depended entirely on hunting and gathering.", "The settlement had no administrative structure."], "answer": 1, "explanation": "The combined evidence points toward an organised urban economy with specialised production, exchange and administration."}, {"id": "q19", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Which of the following is NOT presented in the chapter as part of Mesopotamia's scholarly legacy?", "options": ["Mathematical tables", "Time reckoning", "Observation of stars and eclipses", "The modern decimal place-value system"], "answer": 3, "explanation": "The chapter discusses mathematics, time reckoning and astronomy, but does not present the modern decimal place-value system as part of this legacy."}, {"id": "q20", "type": "mcq", "difficulty": "Very Hard", "marks": 1, "question": "Consider the following statements: (1) Mesopotamian cities depended upon agricultural production. (2) Urban economies included trade, manufacture and services. (3) Division of labour increased interdependence among producers. (4) Organised storage and distribution were important to urban economies. (5) Fertile agricultural land alone explains the emergence of cities. Which option is correct?", "options": ["1, 2, 3 and 4 only", "1, 3 and 5 only", "2, 4 and 5 only", "All five"], "answer": 0, "explanation": "The chapter connects urban life with agriculture, trade, manufacture, services, storage and division of labour, while rejecting a single-factor explanation."}, {"id": "q21", "type": "subjective", "difficulty": "Moderate", "marks": 3, "question": "Why was southern Mesopotamia suitable for agriculture despite its low rainfall?", "modelAnswer": "The Euphrates and Tigris carried fine silt from the northern mountains. When the rivers flooded or their water was channelled into fields, fertile silt was deposited. Small channels also functioned as irrigation canals, allowing water to be brought to fields when necessary."}, {"id": "q22", "type": "subjective", "difficulty": "Hard", "marks": 5, "question": "Explain the significance of the development of writing in Mesopotamian urban society. Refer to record-keeping, transactions, communication and administration.", "modelAnswer": "Writing developed in close connection with the needs of an increasingly complex urban society. Early tablets recorded goods and numbers and were used in temple-related transactions and distributions. Writing made it possible to preserve information, record transactions and communicate messages. Over time, cuneiform became a sophisticated writing system used for administrative, literary, scholarly and other purposes."}, {"id": "q23", "type": "subjective", "difficulty": "Hard", "marks": 5, "question": "“The temple was more than a religious institution in Mesopotamian cities.” Explain.", "modelAnswer": "Temples were associated with gods but also became important economic and administrative institutions. They organised production, received and distributed agricultural produce, employed workers and merchants, and maintained written records. Thus their role extended beyond worship into the organisation of urban economic life."}, {"id": "q24", "type": "subjective", "difficulty": "Very Hard", "marks": 5, "question": "How did the growth of cities create a need for organised trade, transport, storage and division of labour? Support your answer with examples from the chapter.", "modelAnswer": "Urban populations included people engaged in specialised occupations rather than producing everything themselves. Cities therefore depended on organised supplies of food and raw materials. Mesopotamia lacked several materials such as metals, timber and stone, encouraging long-distance exchange. Water transport was important for moving bulky goods. Storage and distribution were also organised through institutions such as temples. These processes increased interdependence among specialised producers."}, {"id": "q25", "type": "subjective", "difficulty": "Very Hard", "marks": 5, "question": "“Mesopotamian civilisation cannot be understood only through its cities; its interaction with pastoral communities was also significant.” Discuss with reference to Mari.", "modelAnswer": "Mari was a major urban centre located upstream on the Euphrates in a region where agriculture and animal rearing were both important. Pastoral communities exchanged animals and animal products for grain and other goods. At the same time, access to fields and water could create conflict between pastoralists and settled farmers. The history of Mari therefore shows interaction, exchange and conflict between urban, agricultural and pastoral groups."}]};
async function init(){test=EMBEDDED_TEST;document.getElementById('introTitle').textContent=test.title;document.getElementById('introSub').textContent=`${test.subtitle} • ${test.questions.length} questions • ${test.durationMinutes} minutes`;document.getElementById('subj').textContent=`${test.subject} • ${test.chapter}`;document.getElementById('title').textContent=test.title;document.getElementById('inst').innerHTML=(test.instructions||[]).map(x=>`<li>${x}</li>`).join('')}
function start(){const name=document.getElementById('name').value.trim();if(!name)return alert('Please enter your name.');startedAt=new Date().toISOString();remaining=test.durationMinutes*60;document.getElementById('intro').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render();interval=setInterval(()=>{remaining--;tick();if(remaining<=0){clearInterval(interval);submitTest(true)}},1000);tick()}
function tick(){const m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;document.getElementById('timer').classList.toggle('danger',remaining<60)}
function render(){const q=test.questions[idx],sel=answers[q.id]?.answer;document.getElementById('fill').style.width=((idx+1)/test.questions.length*100)+'%';document.getElementById('qcard').innerHTML=`<div class="qmeta"><span>Question ${idx+1} of ${test.questions.length}</span><span class="badge ${q.difficulty.replace(' ','\\\\ ')}">${q.difficulty}</span></div><div class="q">${q.question}</div>${q.type==='mcq'?q.options.map((o,i)=>`<label class="option ${String(sel)===String(i)?'selected':''}"><input type="radio" name="opt" ${String(sel)===String(i)?'checked':''} onchange="pick(${i})"><b>${String.fromCharCode(65+i)}.</b> ${o}</label>`).join(''):q.type==='numerical'?`<div class="upload" style="text-align:left"><label for="numericalAnswer"><b>Your numerical answer</b></label><input id="numericalAnswer" class="namebox" style="margin-top:12px" type="number" step="any" inputmode="decimal" placeholder="Enter value" value="${sel??''}" oninput="numericalPick(this.value)"><p style="color:#9daabe">Enter only the final numerical value. Use a decimal if needed.</p></div>`:`<div class="upload"><b>Write your answer in your notebook.</b><p style="color:#9daabe">Upload a clear photograph of your completed answer.</p><input id="photo" type="file" accept="image/*" capture="environment" onchange="photo(this)"><div id="preview"></div></div>`}<div class="nav"><button class="btn secondary" onclick="prev()">← Previous</button>${idx<test.questions.length-1?'<button class="btn primary" onclick="next()">Next →</button>':'<button class="btn primary" onclick="submitTest(false)">Submit Test</button>'}</div>`;if(sel&&q.type==='subjective')document.getElementById('preview').innerHTML=`<img class="photo" src="${sel}">`;document.getElementById('review').innerHTML=test.questions.map((_,i)=>`<button class="dot ${answers[test.questions[i].id]?'done ':''}${i===idx?'current':''}" onclick="goto(${i})">${i+1}</button>`).join('')}
function pick(v){answers[test.questions[idx].id]={questionId:test.questions[idx].id,answer:v};render()}
function numericalPick(v){const q=test.questions[idx];if(v.trim()===''){delete answers[q.id];return}answers[q.id]={questionId:q.id,answer:v}}
function photo(inp){const f=inp.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const compressed=canvas.toDataURL('image/jpeg',0.75);answers[test.questions[idx].id]={questionId:test.questions[idx].id,answer:compressed};render()};img.src=reader.result};reader.readAsDataURL(f)}
function next(){if(idx<test.questions.length-1){idx++;render()}}function prev(){if(idx>0){idx--;render()}}function goto(i){idx=i;render()}
async function submitTest(auto){if(window.__submitting)return;if(!auto&&!confirm('Submit this test? You will not be able to change your answers.'))return;window.__submitting=true;try{clearInterval(interval);let autoScore=0,autoMax=0;for(const q of test.questions){if(q.type==='mcq'||q.type==='numerical'){autoMax+=Number(q.marks)||0;const a=answers[q.id]?.answer;let correct=false;if(q.type==='mcq'){correct=String(a)===String(q.answer)}else{const entered=Number(a),expected=Number(q.answer),tolerance=Number(q.tolerance??0.01);correct=a!==undefined&&a!==''&&Number.isFinite(entered)&&Number.isFinite(expected)&&Math.abs(entered-expected)<=tolerance}if(correct)autoScore+=Number(q.marks)||0}}const exam=document.getElementById('exam');if(!exam)throw new Error('Exam container not found');exam.innerHTML='<div class="card"><div class="eyebrow">Submission received</div><h1>Test Submitted</h1><div class="q" style="font-size:42px">'+autoScore+'/'+autoMax+'</div><p style="color:#9daabe">MCQs and numerical answers are scored automatically. Subjective answers require manual evaluation.</p></div>';}catch(err){window.__submitting=false;console.error(err);alert('Submission failed. Please try again.');}}
init();
</script>
<script>
const IELTS_TEST={id:'ielts-advanced-practice',title:'IELTS-Style Advanced English Mock Test',subtitle:'20 Questions • 5 Sections • 30 Minutes',subject:'English Language',chapter:'Reading, Vocabulary, Grammar, Critical Reasoning & Writing',durationMinutes:30,instructions:['Questions 1–18 are automatically scored.','Essay and sentence transformation answers are saved as you type.','Write the essay in proper paragraphs and aim for 100–130 words.','This is an IELTS-style practice test, not an official IELTS paper or band-score assessment.'],questions:[
{id:'q1',type:'mcq',section:'Section 1 — Reading comprehension',marks:1,question:'What is the passage’s central argument?',options:['Digital technology inevitably undermines democracy.','Greater access to information guarantees informed participation.','The democratic benefits of digital technology depend on how it is used and governed.','Algorithms should be prohibited from distributing information.'],answer:2},
{id:'q2',type:'mcq',section:'Section 1 — Reading comprehension',marks:1,question:'What can be inferred about engagement-driven algorithms?',options:['They always prioritise factual accuracy.','Their priorities may conflict with the goal of informing the public accurately.','They eliminate people’s existing prejudices.','They prevent users from accessing political information.'],answer:1},
{id:'q3',type:'mcq',section:'Section 1 — Reading comprehension',marks:1,question:'The phrase “gravitate towards” most nearly means:',options:['Deliberately reject','Naturally tend to choose or favour','Critically examine','Accidentally overlook'],answer:1},
{id:'q4',type:'mcq',section:'Section 1 — Reading comprehension',marks:1,question:'According to the passage, what is the central challenge?',options:['Eliminating digital platforms altogether.','Ensuring that everyone agrees on political issues.','Expanding information access while improving people’s ability to evaluate it.','Replacing individual judgement with algorithmic decisions.'],answer:2},
{id:'q5',type:'mcq',section:'Section 1 — Reading comprehension',marks:1,question:'The author’s attitude towards digital technology is best described as:',options:['Unconditionally enthusiastic','Entirely dismissive','Cautious and balanced','Indifferent and uninformed'],answer:2},
{id:'q6',type:'mcq',section:'Section 2 — Advanced vocabulary',marks:1,question:'Choose the closest meaning of “ambiguous.”',options:['Open to more than one interpretation','Completely indisputable','Intentionally dishonest','Exceptionally complicated'],answer:0},
{id:'q7',type:'mcq',section:'Section 2 — Advanced vocabulary',marks:1,question:'Choose the best synonym for “mitigate.”',options:['Exacerbate','Alleviate','Disregard','Anticipate'],answer:1},
{id:'q8',type:'mcq',section:'Section 2 — Advanced vocabulary',marks:1,question:'What does “a tenuous argument” mean?',options:['A thoroughly established argument','An argument supported by weak or uncertain reasoning','An argument accepted by everyone','An argument expressed in simple language'],answer:1},
{id:'q9',type:'mcq',section:'Section 2 — Advanced vocabulary',marks:1,question:'Complete the sentence: “Despite extensive research, the relationship between the two variables remains ______.”',options:['conclusive','unequivocal','elusive','redundant'],answer:2},
{id:'q10',type:'mcq',section:'Section 2 — Advanced vocabulary',marks:1,question:'“The proposal was rejected because it was not feasible.” What does feasible mean?',options:['Morally questionable','Practically achievable','Financially irrelevant','Legally prohibited'],answer:1},
{id:'q11',type:'mcq',section:'Section 3 — Grammar and sentence structure',marks:1,question:'Choose the grammatically correct sentence.',options:['Had she known about the changes, she would have prepared differently.','If she would know about the changes, she would have prepared differently.','Had she knew about the changes, she would prepare differently.','If she had knew about the changes, she would have prepared differently.'],answer:0},
{id:'q12',type:'mcq',section:'Section 3 — Grammar and sentence structure',marks:1,question:'Complete the sentence: “Rarely ______ such a comprehensive analysis of the issue.”',options:['we have encountered','have we encountered','we encountered have','did we have encountered'],answer:1},
{id:'q13',type:'mcq',section:'Section 3 — Grammar and sentence structure',marks:1,question:'Choose the correct option: “Neither the researchers nor the supervisor ______ willing to withdraw the findings.”',options:['were','are','was','have been'],answer:2},
{id:'q14',type:'mcq',section:'Section 3 — Grammar and sentence structure',marks:1,question:'Select the correct sentence.',options:['The data, which was collected over five years, reveal a consistent trend.','The data, which were collected over five years, reveal a consistent trend.','The data, that were collected over five years, reveals a consistent trend.','The data which were collect over five years reveal a consistent trend.'],answer:1},
{id:'q15',type:'mcq',section:'Section 3 — Grammar and sentence structure',marks:1,question:'Complete the sentence: “Had the authorities acted sooner, the consequences ______ less severe.”',options:['would be','will have been','would have been','had been'],answer:2},
{id:'q16',type:'mcq',section:'Section 4 — Critical reasoning',marks:1,question:'An experiment finds that students who listen to instrumental music while studying score higher on average. Which conclusion is most justified?',options:['Instrumental music guarantees better academic performance.','Music is the only factor responsible for higher scores.','The observed association does not, by itself, establish that music caused the higher scores.','Students who study in silence cannot perform well.'],answer:2},
{id:'q17',type:'mcq',section:'Section 4 — Critical reasoning',marks:1,question:'A writer claims that online education is more accessible because it removes geographical barriers. Which evidence would most strongly challenge this claim?',options:['Some students prefer classroom discussions.','Many remote communities lack reliable internet access and suitable devices.','Online courses offer recorded lectures.','Several universities have introduced online programmes.'],answer:1},
{id:'q18',type:'mcq',section:'Section 4 — Critical reasoning',marks:1,question:'Choose the sentence that best preserves the meaning: “Although the policy was well-intentioned, its implementation produced unintended consequences.”',options:['The policy failed because its creators had malicious intentions.','Despite its positive intentions, the policy led to outcomes that were not anticipated.','The policy achieved every objective its creators intended.','Its unintended consequences prove that the policy was deliberately harmful.'],answer:1},
{id:'q19',type:'essay',section:'Section 5 — Writing challenge',marks:10,question:'Essay task — 10 marks. Write 100–130 words on this topic: Some people believe that technological advancements make life easier, while others argue that they create new problems. Discuss both views and give your own opinion.'},
{id:'q20',type:'text',section:'Section 5 — Writing challenge',marks:2,question:'Sentence transformation — 2 marks. Rewrite without changing the meaning: “People believe that artificial intelligence will transform the job market.” Begin with: “Artificial intelligence…”'}]};
const IELTS_PASSAGE='The widespread adoption of digital technologies has often been portrayed as an inherently democratising force. By lowering barriers to information, digital platforms appear to offer individuals unprecedented opportunities to participate in public discourse. Yet access to information does not necessarily translate into informed participation. Algorithms frequently prioritise content that maximises engagement rather than accuracy, while users may gravitate towards information that reinforces their existing beliefs.\n\nThis does not imply that digital technology is intrinsically detrimental to democracy. Rather, its consequences depend on the institutional frameworks, commercial incentives and individual habits within which it operates. The central challenge, therefore, is not simply to expand access, but to cultivate the critical faculties required to evaluate information responsibly.';
function init(){test=IELTS_TEST;document.getElementById('introTitle').textContent=test.title;document.getElementById('introSub').textContent=test.subtitle;document.getElementById('subj').textContent=test.subject+' • '+test.chapter;document.getElementById('title').textContent=test.title;document.getElementById('inst').innerHTML=test.instructions.map(x=>'<li>'+x+'</li>').join('')}
function start(){if(!document.getElementById('name').value.trim())return alert('Please enter your name.');startedAt=new Date().toISOString();remaining=test.durationMinutes*60;document.getElementById('intro').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render();interval=setInterval(()=>{remaining--;tick();if(remaining<=0){clearInterval(interval);submitTest(true)}},1000);tick()}
function render(){const q=test.questions[idx],saved=answers[q.id]?.answer;document.getElementById('fill').style.width=((idx+1)/test.questions.length*100)+'%';document.getElementById('title').textContent=q.section;let passage=idx<5?'<div class="eyebrow">Read the passage</div><div class="passage" style="white-space:pre-line;line-height:1.8;margin:18px 0">'+IELTS_PASSAGE+'</div>':'';let response=q.type==='mcq'?q.options.map((o,i)=>'<label class="option '+(String(saved)===String(i)?'selected':'')+'"><input type="radio" name="opt" '+(String(saved)===String(i)?'checked':'')+' onchange="pick('+i+')"><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</label>').join(''):'<textarea class="namebox" style="min-height:'+(q.type==='essay'?'190':'110')+'px;resize:vertical;line-height:1.65" placeholder="'+(q.type==='essay'?'Write 100–130 words in proper paragraphs…':'Artificial intelligence…')+'" oninput="textAnswer(this.value)">'+escapeHTML(saved||'')+'</textarea>'+(q.type==='essay'?'<p class="instructions" id="wordCount">Word count: '+countWords(saved||'')+' / target 100–130</p>':'');document.getElementById('qcard').innerHTML='<div class="qmeta"><span>Question '+(idx+1)+' of '+test.questions.length+'</span><span>'+q.marks+' mark'+(q.marks===1?'':'s')+'</span></div>'+passage+'<div class="q">'+q.question+'</div>'+response+'<div class="nav"><button class="btn secondary" onclick="move(-1)" '+(idx===0?'disabled':'')+'>← Previous</button>'+(idx<test.questions.length-1?'<button class="btn primary" onclick="move(1)">Next →</button>':'<button class="btn primary" onclick="submitTest(false)">Submit Test</button>')+'</div>';document.getElementById('review').innerHTML=test.questions.map((item,i)=>'<button class="dot '+(answers[item.id]&&answers[item.id].answer!==''?'done ':'')+(i===idx?'current':'')+'" onclick="goTo('+i+')">'+(i+1)+'</button>').join('')}
function pick(v){answers[test.questions[idx].id]={questionId:test.questions[idx].id,answer:v};render()}
function textAnswer(v){const q=test.questions[idx];answers[q.id]={questionId:q.id,answer:v};const wc=document.getElementById('wordCount');if(wc)wc.textContent='Word count: '+countWords(v)+' / target 100–130'}
function countWords(s){return s.trim()?s.trim().split(/\s+/).length:0}function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function move(d){idx=Math.max(0,Math.min(test.questions.length-1,idx+d));render()}function goTo(i){idx=i;render()}
async function submitTest(auto){if(window.__submitting)return;if(!auto&&!confirm('Submit this test? You will not be able to change your answers.'))return;window.__submitting=true;clearInterval(interval);let score=0,attempted=0;for(const q of test.questions){if(q.type==='mcq'){if(answers[q.id]&&answers[q.id].answer!==undefined){attempted++;if(answers[q.id].answer===q.answer)score++}}}const exam=document.getElementById('exam');exam.innerHTML='<div class="card"><div class="eyebrow">Submission received</div><h1 class="title">Test Submitted</h1><div class="q" style="font-size:42px">'+score+' / 18</div><p class="instructions">Objective questions attempted: '+attempted+' / 18. Essay and sentence transformation are saved below for your review; they are not automatically graded.</p><h3>Essay response ('+countWords(answers.q19?.answer||'')+' words)</h3><p class="instructions" style="white-space:pre-wrap">'+escapeHTML(answers.q19?.answer||'No answer entered.')+'</p><h3>Sentence transformation</h3><p class="instructions" style="white-space:pre-wrap">'+escapeHTML(answers.q20?.answer||'No answer entered.')+'</p><button class="btn secondary" onclick="location.reload()">Restart test</button></div>'}
init();
</script>
