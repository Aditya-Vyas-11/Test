<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Test Portal</title>
<style>
:root{color-scheme:dark;--bg:#08101d;--card:#0e1929;--line:#20314a;--text:#f5f7fb;--muted:#9eabc0;--accent:#b89b68;--accent2:#7ea4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#14253d 0,#08101d 40%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:28px 18px 60px}.brand{letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-size:12px;font-weight:800}.hero{padding:52px 0 28px}.hero h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,72px);line-height:.98;margin:10px 0}.hero p{color:var(--muted);font-size:16px}.card{background:linear-gradient(145deg,#111e30,#0b1524);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 60px #0005}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid #30445f;border-radius:999px;padding:8px 12px;font-size:12px;color:#cbd5e4}.btn{display:inline-flex;border:0;border-radius:13px;padding:13px 18px;background:var(--accent);color:#101010;font-weight:800;cursor:pointer}.btn.secondary{background:#17263a;color:#e8edf6;border:1px solid #2d425d}.btn:active{transform:translateY(1px)}a{color:inherit;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding-top:32px}}
</style></head>
<body><main class="wrap"><div class="hero"><div class="brand">Private Examination Portal</div><h1>Writing &amp;<br>City Life</h1><p>A premium Class XI History test experience.</p></div>
<section class="card"><div class="meta"><span class="pill">Class XI</span><span class="pill">History</span><span class="pill">25 Questions</span><span class="pill">50 Minutes</span></div><h2>Ready when you are.</h2><p style="color:var(--muted)">Use the test link you were given to begin. For the administrator dashboard, open <b>/admin</b>.</p><div class="grid"><a class="btn" href="/test/demo-writing-city-life">Preview Test</a><a class="btn secondary" href="/admin">Admin Dashboard</a></div></section></main></body></html>
